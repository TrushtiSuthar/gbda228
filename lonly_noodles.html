<!DOCTYPE html>
<html lang="en-ca">
  <head>
    <title>Lonely Noodles - Preview</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Diphylleia&family=Gloria+Hallelujah&family=Libre+Caslon+Display&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Diphylleia&family=Gloria+Hallelujah&family=Libre+Caslon+Display&family=Reenie+Beanie&display=swap" rel="stylesheet">

    <style>
      /* --- Base styles & Centering --- */
      body {
        background-color: #e6d3c3;
        font-family: "Gloria Hallelujah", serif;
        font-size: 18px;
        line-height: 1.7;
        margin: 0;
        padding: 0;
        min-height: 100vh;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        background-image: url('cooking.jpg');
        background-size: cover;
        background-position: center;
      }

      /* Dark overlay to make content pop */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        z-index: -1;
      }

      /* --- HEADER (Fixed/Floating over the image) --- */
      header {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 1200px;
        max-width: calc(100% - 40px);
        z-index: 100;

        display: flex;
        justify-content: space-between;
        padding: 15px 30px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(6px);
        border-radius: 20px;
        align-items: center;
        box-sizing: border-box;
      }

      .logo a {
        font-size: 24px;
        font-weight: bold;
        color: #f7f3f3;
        font-family: "Libre Caslon Display", serif;
        text-decoration: none;
      }

      .recipe-bar {
        width: 300px;
        height: 28px;
        padding: 8px 15px;
        background-color: #ffffff;
        border-radius: 20px;
        color: #aaa;
        line-height: 28px;
        text-align: center;
      }

      .recipe-bar a {
        text-decoration: none;
        color: #aaa;
      }

      /* --- Main Card Container (Dark Box) --- */
      .recipe-card {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;

        background-color: rgba(20, 20, 20, 0.7);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        color: #f7f3f3;
        text-align: center;

        margin-top: 100px;
        margin-bottom: 50px;
      }

      /* --- Typography --- */
      h1 {
        font-size: 2.5em;
        font-family: "Reenie Beanie", serif;
        font-weight: 600;
        color: #f7f3f3;
        margin-top: 0;
      }

      h4 {
        font-family: "Gloria Hallelujah", serif;
        font-weight: 500;
        margin: 0;
        font-size: 1em;
      }

      /* --- Content Layout --- */
      .top-content {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
        flex-direction: column;
      }

      .related-recipe:hover {
        background-color: rgba(0, 0, 0, 0.2);
        cursor: pointer;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      }

      .recipe-image {
        width: 250px;
        height: 250px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #f7f3f3;
      }

      .stats-bar {
        display: flex;
        justify-content: center;
        gap: 30px;
        padding: 10px 0;
        margin: 15px 0 25px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        width: 80%;
        margin-left: auto;
        margin-right: auto;
      }

      .stat-item strong {
        display: block;
        font-family: "Libre Caslon Display", serif;
        font-size: 1.1em;
        font-weight: 700;
        color: #f7f3f3;
        margin-bottom: 3px;
      }

      /* --- Button Style --- */
      .start-button {
        padding: 10px 40px;
        background-color: #174517;
        color: #f7f3f3;
        border: none;
        border-radius: 25px;
        font-family: "Libre Caslon Display", serif;
        font-size: 1.2em;
        font-weight: 600;
        text-transform: none;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        transition: background-color 0.3s;
      }

      .start-button a {
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 10px;
        box-sizing: border-box;
        width: 100%;
        text-decoration: none;
        color: inherit;
      }

      .start-button:hover {
        background-color: #1a641a;
      }

      /* --- Related Recipes Grid --- */
      .related-grid {
        display: flex;
        justify-content: space-around;
        margin-top: 40px;
        gap: 20px;
      }

      .related-recipe {
        text-align: center;
        width: 45%;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 10px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: space-around;
        text-align: left;
      }

      .related-recipe img {
        width: 60px;
        height: 60px;
        border-radius: 5px;
        object-fit: cover;
        margin-right: 10px;
        border: 2px solid #f7f3f3;
      }

      .related-recipe p {
        font-size: 0.8em;
        line-height: 1.3;
        margin: 0;
        color: #bbb;
      }

      .recipe-details {
        display: flex;
        flex-direction: column;
        font-size: 0.9em;
      }

      .recipe-details strong {
        font-size: 1.1em;
        font-family: "Libre Caslon Display", serif;
        font-weight: 600;
        color: #f7f3f3;
      }

      .related-recipe a {
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 10px;
        box-sizing: border-box;
        width: 100%;
        text-decoration: none;
        color: inherit;
      }

      .add-button {
        font-size: 1.5em;
        color: #174517;
        background: #f7f3f3;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        line-height: 28px;
        text-align: center;
      }
    </style>
  </head>


  <body>
    <div class="overlay"></div>

    <header>
      <div class="logo">
        <a href="index.html">Trushti's Recipe Journal</a>
      </div>
      <div class="recipe-bar">
        <a href="lonly_noodles.html">Recipes</a>
      </div>
    </header>

    <div class="recipe-card">

      <div class="top-content">
        <img src="lonly_noodles.jpg" alt="a bowl of noodles" class="recipe-image" />

        <h1>Lonely Noodles</h1>
        <div style="font-size: 0.9em; margin: 5px 0 0 0; color: #bbb;">By: Trushti S.</div>
      </div>

      <div class="stats-bar">
        <div class="stat-item">
          <strong>Servings</strong>
          <h4>1 Bowl </h4>
        </div>
        <div class="stat-item">
          <strong>Prep Time</strong>
          <h4>5 min</h4>
        </div>
        <div class="stat-item">
          <strong>Cook Time</strong>
          <h4>10 min</h4>
        </div>
      </div>

      <button class="start-button">
        <a href="lonly_noodles_recipices.html">
          More
        </a>
      </button>

      <div class="related-grid">

        <div class="related-recipe">
          <a href="quick_chai.html">
            <img src="quick_chai.jpg" alt="cup of Chai" />
            <div class="recipe-details">
              <strong style="margin-bottom: 5px;">Quick Chai</strong>
              <p>Servings: 1-2 cups</p>
              <p>Cook Time: 2 min</p>
            </div>
            <div class="add-button">+</div>
          </a>
        </div>

        <div class="related-recipe">
          <a href="mood_cookies.html">
            <img src="cookies.jpg" alt="a bunch of cookies" />
            <div class="recipe-details">
              <strong style="margin-bottom: 5px;">Mood Cookies</strong>
              <p>Servings: 8-10</p>
              <p>Cook Time: 12-15min</p>
            </div>
            <div class="add-button">+</div>
          </a>
        </div>
      </div>

    </div>
  </body>
</html>

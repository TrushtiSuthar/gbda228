<!DOCTYPE html>
<html lang="en-ca">
  <head>
    <title>Lonely Noodles - Preview</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Diphylleia&family=Libre+Caslon+Display:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
      /* --- Variable Setup --- */
      :root {
        --bg-color: #e6d3c3; 
        --content-width: 1200px;
        --text-dark: #1e1e1e;
        --text-light: #f7f3f3; /* Used for text on dark backgrounds */
        --text-green: #174517;
        --padding-main: 40px; 
        --font-size-base: 18px; 
        --line-height-base: 1.7; 
      }

      /* --- Base styles & Centering --- */
      body {
        background-color: var(--bg-color);
        font-family: "Diphylleia", serif;
        font-size: var(--font-size-base); 
        line-height: var(--line-height-base);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        
        /* Centering the content wrapper vertically and horizontally */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        
        /* Background image for Frame 3 */
        background-image: url('cooking.jpg'); /* Use the kitchen image */
        background-size: cover;
        background-position: center;
      }
      
      /* Dark overlay to make content pop (mimics the design) */
      .overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.4); /* Semi-transparent dark wash */
          backdrop-filter: blur(8px); /* Blur the background image */
          z-index: -1; /* Keep behind the content */
      }
      
      /* Wrapper to hold the content card (narrow, like in the mockup) */
      .card-wrapper {
          width: 100%;
          max-width: 600px; /* Narrower than 1200px to match the visual card */
          position: relative;
      }

      /* --- HEADER (Floating over the image) --- */
      header {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: var(--content-width); 
        max-width: calc(100% - 40px);
        z-index: 100;
        
        display: flex;
        justify-content: space-between;
        padding: 15px 30px;
        background: rgba(255, 255, 255, 0.2); /* Lighter header on dark background */
        backdrop-filter: blur(6px); 
        border-radius: 20px;
        align-items: center;
        box-sizing: border-box;
      }

      .logo {
        font-size: 24px;
        font-weight: bold;
        color: var(--text-light); /* Light logo text */
        font-family: "Libre Caslon Display", serif;
      }

      .search {
        width: 300px;
        height: 28px;
        padding: 8px 15px;
        background-color: #ffffff;
        border-radius: 20px;
        color: #aaa;
        line-height: 28px;
        text-align: center;
      }

      /* --- Main Card Container (Dark Box) --- */
      .recipe-card {
        background-color: rgba(20, 20, 20, 0.7); /* Dark semi-transparent background */
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        color: var(--text-light);
        margin-top: 120px; /* Offset for header */
        text-align: center;
      }

      /* --- Typography --- */
      h1 {
        font-size: 2.5em;
        font-family: "Libre Caslon Display", serif;
        font-weight: 600;
        color: var(--text-light);
        margin-top: 0;
      }

      h4 {
        font-family: "Diphylleia", serif;
        font-weight: 500;
        margin: 0;
        font-size: 1em;
      }

      /* --- Content Layout --- */
      .top-content {
          display: flex;
          align-items: center;
          gap: 20px;
          margin-bottom: 20px;
      }
      
      .recipe-image {
          width: 150px;
          height: 150px;
          border-radius: 50%; /* Circular image */
          object-fit: cover;
          border: 4px solid var(--text-light);
      }
      
      .stats-bar {
          display: flex;
          justify-content: center;
          gap: 30px;
          padding: 10px 0;
          margin: 15px 0 25px 0;
          border-top: 1px solid rgba(255, 255, 255, 0.2);
          border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }
      
      .stat-item strong {
          display: block;
          font-family: "Libre Caslon Display", serif;
          font-size: 1.1em;
          font-weight: 700;
          color: var(--text-light);
          margin-bottom: 3px;
      }
      
      .stat-item h4 {
          font-size: 0.9em;
      }

      /* --- Button Style --- */
      .start-button {
          padding: 10px 40px;
          background-color: var(--text-green);
          color: var(--text-light);
          border: none;
          border-radius: 25px;
          font-family: "Libre Caslon Display", serif;
          font-size: 1.2em;
          font-weight: 600;
          text-transform: uppercase;
          cursor: pointer;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
          transition: background-color 0.3s;
      }
      
      .start-button:hover {
          background-color: #1a641a;
      }
      
      /* --- Related Recipes Grid --- */
      .related-grid {
          display: flex;
          justify-content: space-around;
          margin-top: 40px;
          gap: 20px;
      }
      
      .related-recipe {
          text-align: center;
          width: 30%;
      }
      
      .related-recipe img {
          width: 80px;
          height: 80px;
          border-radius: 10px;
          object-fit: cover;
          margin-bottom: 5px;
          border: 2px solid var(--text-light);
      }
      
      .related-recipe p {
          font-size: 0.8em;
          line-height: 1.3;
          margin: 0;
          color: #bbb;
      }

    </style>
  </head>


  <body>
    <div class="overlay"></div>
    
    <header>
      <div class="logo">Logo</div>
      <div class="search">Search...</div>
    </header>
    
    <div class="card-wrapper">
        <div class="recipe-card">
            
            <div class="top-content">
                <img src="lonely-noodles-dish.jpg" alt="Lonely Noodles Dish" class="recipe-image" />
                
                <div style="text-align: left;">
                    <h1>Lonely Noodles</h1>
                    <p style="font-size: 0.9em; margin: 5px 0 0 0;">By: Trushti S.</p>
                </div>
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <strong>Servings</strong>
                    <h4>1 Bowl</h4>
                </div>
                <div class="stat-item">
                    <strong>Prep Time</strong>
                    <h4>5 Min</h4>
                </div>
                <div class="stat-item">
                    <strong>Cook Time</strong>
                    <h4>10 Min</h4>
                </div>
            </div>

            <button class="start-button">Start</button>
            
            <div class="related-grid">
                <div class="related-recipe">
                    <img src="quick-tuna.jpg" alt="Quick Tuna" />
                    <p>Quick Tuna<br>3 min</p>
                </div>
                <div class="related-recipe">
                    <img src="oatmeal.jpg" alt="Plain Oatmeal" />
                    <p>Plain Oatmeal<br>5 min</p>
                </div>
                <div class="related-recipe">
                    <img src="mac-cheese.jpg" alt="Microwave Mac" />
                    <p>Microwave Mac<br>12 min</p>
                </div>
            </div>
            
        </div>
    </div>
  </body>
</html>

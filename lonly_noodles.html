<!DOCTYPE html>
<html lang="en-ca">
  <head>
    <title>Lonely Noodles - Preview</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Diphylleia&family=Libre+Caslon+Display:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
      /* --- Direct Value Setup (Mapping previous variables) --- */
      /* Colors: #e6d3c3 (body), #f7f3f3 (text light), #174517 (text green) */
      
      /* --- Base styles & Centering --- */
      body {
        background-color: #e6d3c3;
        font-family: "Diphylleia", serif;
        font-size: 18px; 
        line-height: 1.7;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        
        background-image: url('cooking.jpg'); 
        background-size: cover;
        background-position: center;
      }
      
      /* Dark overlay to make content pop (mimics the design) */
      .overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.4); 
          backdrop-filter: blur(8px); 
          z-index: -1; 
      }

      /* --- HEADER (Fixed/Floating over the image) --- */
      header {
        position: fixed; /* Fixed position makes it stay on screen */
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 1200px; 
        max-width: calc(100% - 40px);
        z-index: 100;
        
        display: flex;
        justify-content: space-between;
        padding: 15px 30px;
        background: rgba(255, 255, 255, 0.2); 
        backdrop-filter: blur(6px); 
        border-radius: 20px;
        align-items: center;
        box-sizing: border-box;
      }

      .logo a {
        font-size: 24px;
        font-weight: bold;
        color: #f7f3f3; /* Text Light */
        font-family: "Libre Caslon Display", serif;
        text-decoration: none; /* Remove underline from link */
      }

      .recipe-bar {
        width: 300px;
        height: 28px;
        padding: 8px 15px;
        background-color: #ffffff;
        border-radius: 20px;
        color: #aaa;
        line-height: 28px;
        text-align: center;
      }
      
      .recipe-bar a {
          text-decoration: none;
          color: #aaa;
      }

      /* --- Main Card Container (Dark Box) --- */
      .recipe-card {
        /* Replaces .card-wrapper centering */
        width: 100%;
        max-width: 600px; 
        margin: 0 auto; 
          
        background-color: rgba(20, 20, 20, 0.7); 
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        color: #f7f3f3; /* Text Light */
        /* Since body is centering us, we don't need margin-top for card */
        text-align: center;
        
        /* Ensure the card has space from the bottom if viewport is very short */
        margin-top: 100px; 
        margin-bottom: 50px;
      }

      /* --- Typography --- */
      h1 {
        font-size: 2.5em;
        font-family: "Libre Caslon Display", serif;
        font-weight: 600;
        color: #f7f3f3;
        margin-top: 0;
      }

      h4 {
        font-family: "Diphylleia", serif;
        font-weight: 500;
        margin: 0;
        font-size: 1em;
      }

      /* --- Content Layout --- */
      .top-content {
          display: flex;
          align-items: center;
          gap: 20px;
          margin-bottom: 20px;
      }
      
      .recipe-image {
          width: 150px;
          height: 150px;
          border-radius: 50%; 
          object-fit: cover;
          border: 4px solid #f7f3f3;
      }
      
      .stats-bar {
          display: flex;
          justify-content: center;
          gap: 30px;
          padding: 10px 0;
          margin: 15px 0 25px 0;
          border-top: 1px solid rgba(255, 255, 255, 0.2);
          border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }
      
      .stat-item strong {
          display: block;
          font-family: "Libre Caslon Display", serif;
          font-size: 1.1em;
          font-weight: 700;
          color: #f7f3f3;
          margin-bottom: 3px;
      }

      /* --- Button Style --- */
      .start-button {
          padding: 10px 40px;
          background-color: #174517; /* Text Green */
          color: #f7f3f3;
          border: none;
          border-radius: 25px;
          font-family: "Libre Caslon Display", serif;
          font-size: 1.2em;
          font-weight: 600;
          text-transform: uppercase;
          cursor: pointer;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
          transition: background-color 0.3s;
      }
      
      .start-button:hover {
          background-color: #1a641a;
      }
      
      /* --- Related Recipes Grid --- */
      .related-grid {
          display: flex;
          justify-content: space-around;
          margin-top: 40px;
          gap: 20px;
      }
      
      .related-recipe {
          text-align: center;
          width: 30%;
      }
      
      .related-recipe img {
          width: 80px;
          height: 80px;
          border-radius: 10px;
          object-fit: cover;
          margin-bottom: 5px;
          border: 2px solid #f7f3f3;
      }
      
      .related-recipe p {
          font-size: 0.8em;
          line-height: 1.3;
          margin: 0;
          color: #bbb;
      }

    </style>
  </head>


  <body>
    <div class="overlay"></div>
    
    <header>
      <div class="logo">
        <a href="index.html">Trushti's Recipe Journal</a>
      </div>
      <div class="recipe-bar">
        <a href="lonly_noodles.html">Recipe...</a>
      </div>
    </header>
    
    <div class="recipe-card">
        
        <div class="top-content">
            <img src="lonely-noodles-dish.jpg" alt="Lonely Noodles Dish" class="recipe-image" />
            
            <div style="text-align: left;">
                <h1>Lonely Noodles</h1>
                <p style="font-size: 0.9em; margin: 5px 0 0 0;">By: Trushti S.</p>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <strong>Servings</strong>
                <h4>1 Bowl</h4>
            </div>
            <div class="stat-item">
                <strong>Prep Time</strong>
                <h4>5 Min</h4>
            </div>
            <div class="stat-item">
                <strong>Cook Time</strong>
                <h4>10 Min</h4>
            </div>
        </div>

        <button class="start-button">Start</button>
        
        <div class="related-grid">
            <div class="related-recipe">
                <img src="quick-tuna.jpg" alt="Quick Tuna" />
                <p>Quick Tuna<br>3 min</p>
            </div>
            <div class="related-recipe">
                <img src="oatmeal.jpg" alt="Plain Oatmeal" />
                <p>Plain Oatmeal<br>5 min</p>
            </div>
            <div class="related-recipe">
                <img src="mac-cheese.jpg" alt="Microwave Mac" />
                <p>Microwave Mac<br>12 min</p>
            </div>
        </div>
        
    </div>
  </body>
</html>
